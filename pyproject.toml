[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "image-dataset-studio"
version = "0.1.0"
description = "PyQt6 image dataset tag and caption editor with local vision models"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyQt6>=6.8,<7", "Pillow>=11,<13", "numpy>=1.26,<2.5",
  "huggingface-hub>=0.34,<1", "transformers==4.57.6", "einops>=0.8,<1",
  "timm>=1.0.20,<1.0.30", "safetensors>=0.5", "requests>=2.32,<2.34",
]

[project.optional-dependencies]
cpu = ["torch>=2.6,<3", "torchvision>=0.21,<1", "onnxruntime>=1.20,<2"]
cuda = ["torch>=2.6,<3", "torchvision>=0.21,<1", "onnxruntime-gpu>=1.27,<2"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12", "pyinstaller>=6.15,<7"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" },
         { index = "pytorch-cu130", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" },
               { index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.gui-scripts]
image-dataset-studio = "image_dataset_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_dataset_studio = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]
